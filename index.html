<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المرافق الذكية — أحمد عماره</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{
  --bg:#0a0e16; --bg2:#121826; --panel:rgba(26,33,48,0.85); --panel2:rgba(35,44,61,0.85);
  --text:#e8eef7; --muted:#8b95a5; --border:#2b3345; --input-bg:#0f1520;
  --accent:#4a6cf7; --accent2:#6b8cff;
  --water:#2e9df7; --electric:#f7b731; --gas:#eb3b5a; --internet:#20bf6b;
  --shadow:0 8px 30px rgba(0,0,0,.35);
}
body.light{
  --bg:#eef2f9; --bg2:#f7f9fc; --panel:rgba(255,255,255,0.9); --panel2:rgba(240,243,249,0.9);
  --text:#1a2233; --muted:#6b7688; --border:#e2e8f0; --input-bg:#f7f9fc;
  --shadow:0 8px 30px rgba(0,0,0,.08);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:'Segoe UI',Tahoma,sans-serif;background:var(--bg);color:var(--text);
  min-height:100vh;transition:.3s;overflow-x:hidden;position:relative;
  padding:14px;
}

/* ============================================
   🌌 الخلفية الحية
============================================ */
#liveBg{
  position:fixed;inset:0;z-index:-2;overflow:hidden;
  background:linear-gradient(135deg,#0a0e16 0%,#121826 50%,#0a0e16 100%);
}
body.light #liveBg{
  background:linear-gradient(135deg,#eef2f9 0%,#f7f9fc 50%,#eef2f9 100%);
}
.blob{
  position:absolute;border-radius:50%;filter:blur(80px);opacity:.35;
  animation:blobFloat 22s infinite ease-in-out;
}
body.light .blob{opacity:.28;filter:blur(90px)}
.blob.water{background:#2e9df7;width:420px;height:420px;top:-100px;right:-100px;animation-delay:0s}
.blob.electric{background:#f7b731;width:380px;height:380px;bottom:-80px;left:-80px;animation-delay:-6s}
.blob.gas{background:#eb3b5a;width:340px;height:340px;top:40%;left:40%;animation-delay:-12s}
.blob.internet{background:#20bf6b;width:400px;height:400px;bottom:20%;right:20%;animation-delay:-18s}
@keyframes blobFloat{
  0%,100%{transform:translate(0,0) scale(1)}
  25%{transform:translate(60px,-40px) scale(1.15)}
  50%{transform:translate(-40px,60px) scale(0.9)}
  75%{transform:translate(40px,40px) scale(1.08)}
}

/* ====== شعار مائي ====== */
#bgGrid{
  position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.05;
  background-image:
    linear-gradient(rgba(255,255,255,.5) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.5) 1px,transparent 1px);
  background-size:40px 40px;
}
body.light #bgGrid{
  opacity:.35;
  background-image:
    linear-gradient(rgba(0,0,0,.08) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,0,0,.08) 1px,transparent 1px);
}

/* ============================================
   TOP BAR
============================================ */
.top-bar{max-width:1200px;margin:0 auto 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:900}
.brand .logo{
  width:44px;height:44px;border-radius:12px;
  background:linear-gradient(135deg,var(--water),var(--internet));
  display:flex;align-items:center;justify-content:center;font-size:22px;
  box-shadow:0 6px 20px rgba(46,157,247,.5);
  animation:pulseLogo 3s infinite;
}
@keyframes pulseLogo{
  0%,100%{box-shadow:0 6px 20px rgba(46,157,247,.5)}
  50%{box-shadow:0 6px 30px rgba(46,157,247,.8),0 0 40px rgba(32,191,107,.4)}
}
.brand-text{background:linear-gradient(135deg,var(--water),var(--internet));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.top-actions{display:flex;gap:8px}
.icon-btn{
  background:var(--panel);border:1px solid var(--border);color:var(--text);
  width:42px;height:42px;border-radius:12px;cursor:pointer;font-size:18px;
  transition:.2s;display:flex;align-items:center;justify-content:center;
  backdrop-filter:blur(12px);
}
.icon-btn:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--accent)}

/* ============================================
   TABS
============================================ */
.tabs{
  max-width:1200px;margin:0 auto 20px;display:flex;gap:6px;
  background:var(--panel);padding:6px;border-radius:16px;
  border:1px solid var(--border);box-shadow:var(--shadow);overflow-x:auto;
  backdrop-filter:blur(16px);
}
.tab{
  flex:1;min-width:110px;padding:12px 14px;text-align:center;border-radius:12px;
  cursor:pointer;font-weight:700;font-size:14px;transition:.25s;
  border:none;background:transparent;color:var(--muted);white-space:nowrap;
}
.tab.active{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 4px 14px rgba(74,108,247,.45)}

/* ============================================
   SECTIONS
============================================ */
.section{display:none;max-width:1200px;margin:0 auto}
.section.active{display:block;animation:fadeUp .4s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ============================================
   ⚡ QUICK JUMP BAR (الإدخال)
============================================ */
.quick-jump{
  display:flex;justify-content:center;gap:10px;flex-wrap:wrap;
  background:var(--panel);padding:14px;border-radius:16px;
  border:1px solid var(--border);box-shadow:var(--shadow);
  margin-bottom:18px;align-items:center;backdrop-filter:blur(16px);
}
.quick-jump label{font-weight:800;font-size:13px;color:var(--muted)}
.quick-jump select{
  padding:10px 14px;border-radius:10px;border:1px solid var(--border);
  background:var(--input-bg);color:var(--text);font-size:14px;font-weight:700;
  cursor:pointer;outline:none;
}
.quick-jump button{
  padding:10px 18px;border-radius:10px;border:none;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#fff;font-weight:800;cursor:pointer;transition:.2s;font-size:13px;
}
.quick-jump button:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(74,108,247,.4)}
.quick-jump button.gray{background:linear-gradient(135deg,#6c757d,#495057)}
.quick-jump button.today{background:linear-gradient(135deg,#25D366,#128C7E)}
.editing-badge{
  padding:8px 16px;border-radius:20px;font-size:12px;font-weight:800;
  background:linear-gradient(135deg,#f7b731,#eb9d0e);color:#1a1a1a;
  display:none;align-items:center;gap:6px;
}
.editing-badge.show{display:inline-flex;animation:pulseBadge 1.5s infinite}
@keyframes pulseBadge{0%,100%{opacity:1}50%{opacity:.7}}

/* ============================================
   INPUT GRID
============================================ */
.input-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;margin-bottom:18px}
.u-card{
  background:var(--panel);border-radius:16px;padding:16px;
  border:1px solid var(--border);box-shadow:var(--shadow);
  border-top:4px solid var(--accent);position:relative;overflow:hidden;
  backdrop-filter:blur(16px);
}
.u-card.water{border-top-color:var(--water)}
.u-card.electric{border-top-color:var(--electric)}
.u-card.gas{border-top-color:var(--gas)}
.u-card.internet{border-top-color:var(--internet)}
.u-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;padding-bottom:10px;border-bottom:1px dashed var(--border)}
.u-title{font-weight:800;font-size:16px;display:flex;align-items:center;gap:8px}
.u-emoji{font-size:22px}
.field-row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.field-row label{font-size:13px;color:var(--muted);font-weight:700}
.field-row input{
  width:110px;padding:9px 12px;border:1px solid var(--border);border-radius:10px;
  background:var(--input-bg);color:var(--text);font-size:15px;font-weight:700;
  text-align:center;direction:ltr;outline:none;transition:.2s;
}
.field-row input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(74,108,247,.18)}

/* ============================================
   📚 AWARENESS CARDS
============================================ */
.awareness-section{margin:24px 0 18px}
.awareness-title{
  font-size:18px;font-weight:900;margin-bottom:14px;
  display:flex;align-items:center;gap:10px;
}
.awareness-title::before{content:'';width:4px;height:24px;background:linear-gradient(180deg,var(--water),var(--internet));border-radius:2px}

.awareness-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.aw-card{
  background:var(--panel);border-radius:18px;padding:18px;
  border:1px solid var(--border);box-shadow:var(--shadow);
  position:relative;overflow:hidden;backdrop-filter:blur(16px);
  border-right:5px solid var(--accent);
  transition:.3s;
}
.aw-card:hover{transform:translateY(-4px);box-shadow:0 12px 35px rgba(0,0,0,.2)}
.aw-card.water{border-right-color:var(--water)}
.aw-card.electric{border-right-color:var(--electric)}
.aw-card.gas{border-right-color:var(--gas)}
.aw-card.internet{border-right-color:var(--internet)}

.aw-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.aw-icon{
  width:50px;height:50px;border-radius:14px;
  display:flex;align-items:center;justify-content:center;
  font-size:26px;flex-shrink:0;
  background:linear-gradient(135deg,var(--input-bg),var(--panel2));
  box-shadow:inset 0 2px 8px rgba(0,0,0,.2);
}
.aw-card.water .aw-icon{background:linear-gradient(135deg,rgba(46,157,247,.25),rgba(46,157,247,.05));box-shadow:0 0 20px rgba(46,157,247,.3)}
.aw-card.electric .aw-icon{background:linear-gradient(135deg,rgba(247,183,49,.25),rgba(247,183,49,.05));box-shadow:0 0 20px rgba(247,183,49,.3)}
.aw-card.gas .aw-icon{background:linear-gradient(135deg,rgba(235,59,90,.25),rgba(235,59,90,.05));box-shadow:0 0 20px rgba(235,59,90,.3)}
.aw-card.internet .aw-icon{background:linear-gradient(135deg,rgba(32,191,107,.25),rgba(32,191,107,.05));box-shadow:0 0 20px rgba(32,191,107,.3)}

.aw-head-text h4{margin:0;font-size:16px;font-weight:900}
.aw-head-text p{margin:3px 0 0;font-size:11px;color:var(--muted);font-weight:700}

.aw-def{
  font-size:13px;line-height:1.7;color:var(--text);
  padding:10px 12px;border-radius:10px;
  background:var(--input-bg);border:1px dashed var(--border);
  margin-bottom:10px;
}
.aw-def b{color:var(--accent)}

.aw-facts{display:flex;flex-direction:column;gap:8px}
.aw-fact{
  display:flex;align-items:flex-start;gap:8px;
  font-size:12px;line-height:1.5;color:var(--muted);
  padding:8px 10px;border-radius:8px;background:var(--panel2);
}
.aw-fact .fico{font-size:14px;flex-shrink:0}
.aw-fact b{color:var(--text)}

.aw-stat-visual{
  margin-top:12px;display:flex;gap:4px;height:8px;border-radius:4px;overflow:hidden;
}
.aw-stat-visual span{flex:1;border-radius:2px;opacity:.8}

/* ============================================
   ACTION BAR
============================================ */
.action-bar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:16px auto;max-width:1200px}
.action-btn{
  padding:11px 18px;border-radius:12px;border:none;font-weight:700;cursor:pointer;
  color:#fff;font-size:14px;transition:.2s;display:inline-flex;align-items:center;gap:6px;
}
.action-btn:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.25)}
.btn-save{background:linear-gradient(135deg,#25D366,#128C7E)}
.btn-img{background:linear-gradient(135deg,var(--accent),var(--accent2))}
.btn-export{background:linear-gradient(135deg,#f7b731,#eb9d0e);color:#1a1a1a}
.btn-clear{background:linear-gradient(135deg,#6c757d,#495057)}

/* ============================================
   CALENDAR
============================================ */
.calendar-bar{
  display:flex;justify-content:center;gap:10px;flex-wrap:wrap;
  background:var(--panel);padding:14px;border-radius:16px;
  border:1px solid var(--border);box-shadow:var(--shadow);
  margin-bottom:18px;align-items:center;backdrop-filter:blur(16px);
}
.calendar-bar select{
  padding:10px 14px;border-radius:10px;border:1px solid var(--border);
  background:var(--input-bg);color:var(--text);font-size:14px;font-weight:700;
  cursor:pointer;outline:none;
}
.calendar-bar button{
  padding:10px 18px;border-radius:10px;border:none;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#fff;font-weight:800;cursor:pointer;transition:.2s;font-size:13px;
}
.calendar-bar button:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(74,108,247,.4)}
.calendar-bar button.gray{background:linear-gradient(135deg,#6c757d,#495057)}

/* ============================================
   MONTH CARD
============================================ */
.months-feed{display:flex;flex-direction:column;gap:20px}
.month-card{
  background:var(--panel);
  border-radius:22px;border:1px solid var(--border);box-shadow:var(--shadow);
  overflow:hidden;position:relative;
  opacity:0;transform:translateY(24px);
  animation:cardIn .55s cubic-bezier(.2,.7,.3,1) forwards;
  backdrop-filter:blur(16px);
}
@keyframes cardIn{to{opacity:1;transform:none}}
.month-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:5px;
  background:linear-gradient(90deg,var(--water),var(--electric),var(--gas),var(--internet));
}
.mc-head{
  display:flex;justify-content:space-between;align-items:center;
  padding:18px 22px 14px;border-bottom:1px solid var(--border);
  background:linear-gradient(135deg,var(--panel) 0%,var(--panel2) 100%);
  gap:12px;flex-wrap:wrap;
}
.mc-head-left{display:flex;align-items:center;gap:14px;min-width:0}
.mc-month-circle{
  width:58px;height:58px;border-radius:16px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-weight:900;line-height:1;box-shadow:0 6px 18px rgba(74,108,247,.4);flex-shrink:0;
}
.mc-month-circle .num{font-size:22px}
.mc-month-circle .yr{font-size:10px;opacity:.85;margin-top:2px}
.mc-title-block h3{margin:0;font-size:18px;font-weight:900}
.mc-title-block p{margin:3px 0 0;font-size:12px;color:var(--muted);font-weight:700}
.mc-total-badge{
  background:linear-gradient(135deg,#f7b731,#eb3b5a);color:#fff;
  padding:10px 18px;border-radius:16px;font-weight:900;font-size:16px;
  display:flex;flex-direction:column;align-items:center;
  box-shadow:0 6px 18px rgba(235,59,90,.3);
}
.mc-total-badge small{font-size:10px;font-weight:700;opacity:.9;letter-spacing:.5px}
.mc-body{display:grid;grid-template-columns:1fr 1fr;gap:0}
@media(max-width:720px){.mc-body{grid-template-columns:1fr}}
.mc-list{padding:20px 22px;border-left:1px solid var(--border)}
@media(max-width:720px){.mc-list{border-left:none;border-bottom:1px solid var(--border)}}
.mc-list-title{
  font-size:12px;font-weight:800;color:var(--muted);letter-spacing:1px;
  margin-bottom:14px;text-transform:uppercase;display:flex;align-items:center;gap:6px;
}
.util-line{
  display:grid;grid-template-columns:auto 1fr auto;align-items:center;
  gap:12px;padding:11px 12px;border-radius:12px;margin-bottom:8px;
  background:var(--input-bg);border:1px solid var(--border);
  border-right:4px solid var(--accent);transition:.25s;
}
.util-line:hover{transform:translateX(-3px);box-shadow:0 4px 12px rgba(0,0,0,.15)}
.util-line.water{border-right-color:var(--water)}
.util-line.electric{border-right-color:var(--electric)}
.util-line.gas{border-right-color:var(--gas)}
.util-line.internet{border-right-color:var(--internet)}
.util-icon{
  width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  font-size:18px;flex-shrink:0;background:var(--panel2);
}
.util-info{min-width:0}
.util-info .name{font-size:14px;font-weight:800;margin-bottom:2px}
.util-info .cons{font-size:11px;color:var(--muted);font-weight:700;direction:ltr;text-align:right}
.util-info .cons b{color:var(--text)}
.util-price{font-size:16px;font-weight:900;direction:ltr;text-align:left;white-space:nowrap}
.util-price small{font-size:10px;color:var(--muted);font-weight:700;margin-right:3px}

.mc-total-line{
  margin-top:14px;padding:12px 14px;border-radius:12px;
  background:linear-gradient(135deg,rgba(74,108,247,.15),rgba(107,140,255,.05));
  border:1px dashed var(--accent);
  display:flex;justify-content:space-between;align-items:center;font-weight:900;
}
.mc-total-line .lbl{font-size:13px;color:var(--muted)}
.mc-total-line .val{font-size:20px;direction:ltr;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}

.mc-chart{
  padding:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(circle at 50% 100%,rgba(74,108,247,.08),transparent 65%),var(--panel);
  position:relative;
}
.chart-title{
  font-size:12px;font-weight:800;color:var(--muted);letter-spacing:1px;margin-bottom:16px;
  text-transform:uppercase;display:flex;align-items:center;gap:6px;
}
.chart-bars{
  display:flex;align-items:flex-end;justify-content:space-around;gap:14px;
  width:100%;max-width:340px;height:200px;padding:0 10px;
  border-bottom:2px solid var(--border);position:relative;
}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;position:relative;min-width:0}
.bar-rect{
  width:100%;max-width:50px;border-radius:10px 10px 4px 4px;
  position:relative;transition:height 1s cubic-bezier(.2,.7,.3,1);
  box-shadow:0 -4px 14px rgba(0,0,0,.15) inset,0 4px 12px rgba(0,0,0,.15);
  overflow:hidden;min-height:4px;
}
.bar-rect::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.35) 0%,transparent 40%,rgba(0,0,0,.15) 100%)}
.bar-rect .glow{position:absolute;top:0;left:0;right:0;height:4px;background:rgba(255,255,255,.6);filter:blur(2px)}
.bar-val{
  position:absolute;top:-24px;font-size:11px;font-weight:900;direction:ltr;
  background:var(--panel);padding:2px 7px;border-radius:8px;border:1px solid var(--border);
  white-space:nowrap;opacity:0;transform:translateY(6px);
  animation:valIn .5s ease forwards;animation-delay:.7s;
}
@keyframes valIn{to{opacity:1;transform:translateY(0)}}
.bar-label{margin-top:10px;font-size:11px;font-weight:800;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center}
.bar-label .emoji{font-size:18px}

.mc-actions{
  display:flex;gap:8px;padding:14px 22px;border-top:1px solid var(--border);
  background:var(--panel2);justify-content:flex-end;flex-wrap:wrap;
}
.mini-btn{
  padding:8px 14px;border-radius:10px;border:1px solid var(--border);
  font-size:12px;font-weight:800;cursor:pointer;transition:.2s;
  background:var(--panel);color:var(--text);
}
.mini-btn:hover{background:var(--accent);color:#fff;border-color:var(--accent);transform:translateY(-2px)}
.mini-btn.danger:hover{background:var(--gas);border-color:var(--gas)}

/* ============================================
   YEAR CARD
============================================ */
.year-card{
  background:var(--panel);border-radius:22px;border:1px solid var(--border);
  box-shadow:var(--shadow);overflow:hidden;position:relative;
  opacity:0;transform:translateY(24px);animation:cardIn .55s cubic-bezier(.2,.7,.3,1) forwards;
  backdrop-filter:blur(16px);margin-bottom:22px;
}
.year-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:5px;
  background:linear-gradient(90deg,var(--water),var(--electric),var(--gas),var(--internet));
}
.year-head{
  padding:20px 24px;display:flex;justify-content:space-between;align-items:center;
  background:linear-gradient(135deg,var(--panel) 0%,var(--panel2) 100%);
  border-bottom:1px solid var(--border);flex-wrap:wrap;gap:12px;
}
.year-title{display:flex;align-items:center;gap:16px}
.year-circle{
  width:70px;height:70px;border-radius:20px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-weight:900;line-height:1;box-shadow:0 8px 24px rgba(74,108,247,.45);flex-shrink:0;
}
.year-circle .num{font-size:24px}
.year-circle .lbl{font-size:9px;opacity:.85;margin-top:3px;font-weight:700}
.year-title h3{margin:0;font-size:22px;font-weight:900}
.year-title p{margin:4px 0 0;font-size:12px;color:var(--muted);font-weight:700}
.year-total-badge{
  background:linear-gradient(135deg,#f7b731,#eb3b5a);color:#fff;
  padding:12px 22px;border-radius:16px;font-weight:900;font-size:18px;

.year-mini{

.year-mini .big{font-size:22px;font-weight:900;direction:ltr}
.year-mini .big small{font-size:11px;color:var(--muted)}
.year-mini .sub{font-size:11px;color:var(--muted);margin-top:4px;font-weight:700}

.year-chart-section{padding:0 24px 20px}
.year-chart-title{

}
.year-chart-title .legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;font-weight:800;color:var(--muted)}
.year-chart-title .legend span{display:inline-flex;align-items:center;gap:5px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.dot.water{background:var(--water)}
.dot.electric{background:var(--electric)}
.dot.gas{background:var(--gas)}
.dot.internet{background:var(--internet)}
.year-chart{
  display:flex;gap:6px;align-items:flex-end;padding:10px 0;

}
.year-bar-col{
  flex:1;min-width:34px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
  height:160px;gap:2px;
}
.year-bar-group{display:flex;gap:1px;align-items:flex-end;height:100%;width:100%;justify-content:center}
.year-bar{width:6px;border-radius:2px 2px 0 0;transition:.3s;min-height:1px}
.year-bar-label{font-size:9px;color:var(--muted);font-weight:800;text-align:center;margin-top:4px;white-space:nowrap}

.year-months-list{

}

}

.year-month-info .name{font-weight:800;font-size:14px;margin-bottom:3px}
.year-month-info .detail{font-size:11px;color:var(--muted);font-weight:700;direction:ltr;text-align:right}
.year-month-total{font-size:16px;font-weight:900;direction:ltr;text-align:left;white-space:nowrap}

/* EMPTY */
.empty-state{
  text-align:center;padding:60px 20px;color:var(--muted);

  backdrop-filter:blur(16px);
}
.empty-state .icon{font-size:64px;margin-bottom:12px;opacity:.6}
.empty-state h3{margin:0 0 8px;color:var(--text);font-size:18px}

/* FOOTER */
.footer-bar{
  max-width:1200px;margin:24px auto 0;text-align:center;padding:16px;
  color:var(--muted);font-weight:800;border-top:1px solid var(--border);font-size:13px;
}

/* MODAL */
.modal{
  display:none;position:fixed;z-index:3000;inset:0;
  background:rgba(0,0,0,.85);backdrop-filter:blur(6px);padding:20px;overflow-y:auto;
}
.modal.show{display:flex;align-items:flex-start;justify-content:center;padding-top:40px}
.modal-box{
  background:var(--panel);border-radius:18px;padding:20px;max-width:450px;width:100%;

}
@keyframes popIn{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
.modal-box h3{margin:0 0 14px;text-align:center}

.close-x{position:absolute;top:10px;left:15px;font-size:26px;cursor:pointer;color:var(--muted);font-weight:900;background:none;border:none}

/* TOAST */
.toast{
  position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(120px);
  background:linear-gradient(135deg,#20bf6b,#0fb9b1);color:#fff;

<div class="toast" id="toast"></div>

<script>
/* =========================================================
   1) الإعدادات
========================================================= */
const UTILITIES = [
  {id:'water',    name:'المياه',    emoji:'💧', unit:'م³',  cls:'water'},
  {id:'electric', name:'الكهرباء',  emoji:'⚡', unit:'ك.و', cls:'electric'},

];
const MONTHS_AR = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const COLORS = {water:'#2e9df7',electric:'#f7b731',gas:'#eb3b5a',internet:'#20bf6b'};
const FIELDS = ['الاستهلاك','الفاتورة'];

/* ====== محتوى التوعية العلمية ====== */
const AWARENESS = {
  water: {
    emoji:'💧', title:'المياه',
    subtitle:'أساس الحياة — كل قطرة تهم',
    definition:`<b>المياه</b> مورد طبيعي غير متجدد بسهولة. تُنتَج مياه الشرب من محطات معالجة تمر بمراحل: الترويب، الترسيب، الفلترة، والتطهير بالكلور.`,
    facts:[
      {ico:'🌍', txt:'<b>97.5%</b> من مياه الكوكب مالحة، و<b>2.5%</b> فقط عذبة — منها 70% متجمدة.'},
      {ico:'🚰', txt:'متوسط استهلاك الفرد عالمياً <b>50-100 لتر/يوم</b>، وفي مصر ~<b>120-200 لتر</b>.'},
      {ico:'⚠️', txt:'تسريب صنبور واحد = <b>20 لتر/يوم</b> مهدرة = <b>600 لتر/شهر</b>.'},
      {ico:'💡', txt:'تركيب قاطع تدفق يوفّر <b>30-50%</b> من الاستهلاك بدون تغيير العادة.'},
      {ico:'🏭', txt:'ري النباتات صباحاً يقلل التبخر بنسبة <b>40%</b> مقارنةً بالمساء.'}
    ],
    bars:[85,60,30,90,45]
  },
  electric: {
    emoji:'⚡', title:'الكهرباء',
    subtitle:'طاقة لا تُرى... لكن حسابها مرئي',
    definition:`<b>الكهرباء</b> طاقة ناتجة عن حركة الإلكترونات. تُقاس بوحدة <b>الكيلوواط/ساعة (ك.و.س)</b>، وهو استهلاك جهاز بقدرة 1000 واط لمدة ساعة.`,
    facts:[
      {ico:'🔌', txt:'<b>1 ك.و.س</b> = تشغيل مكيف 1000 واط لمدة ساعة كاملة.'},
      {ico:'🧊', txt:'المكيف يستهلك <b>60%</b> من فاتورة المنزل صيفاً. ضبطه على <b>24°م</b> يوفر <b>15%</b>.'},
      {ico:'💡', txt:'<b>LED</b> تستهلك <b>80%</b> أقل من المتوهجة وعمرها <b>25 ضعفاً</b>.'},
      {ico:'🔋', txt:'وضع <b>Standby</b> للأجهزة يستهلك <b>5-10%</b> من الفاتورة سنوياً.'},
      {ico:'⚠️', txt:'أحمال عالية في وقت واحد = خطر على الشبكة وقد يؤدي لانقطاع.'}
    ],
    bars:[40,90,75,55,80]
  },
  gas: {
    emoji:'🔥', title:'الغاز الطبيعي',

    facts:[
      {ico:'🍲', txt:'<b>1 م³</b> من الغاز = طاقة تكفي لطهي وجبة كاملة لعائلة من 4 أفراد.'},

      {ico:'⚠️', txt:'رائحة الغاز مضافة صناعياً — <b>لا تشعل ناراً</b> عند شمها، افتح النوافذ فوراً.'},

      {ico:'💚', txt:'الغاز أنظف من الفحم بـ <b>50%</b> انبعاثات كربونية.'}

    bars:[60,30,85,45,70]
  },
  internet: {

    definition:`<b>الإنترنت</b> شبكة عالمية تربط ملايين الأجهزة. تُقاس سرعته بـ <b>ميغابت/ثانية (Mbps)</b>، والاستهلاك بـ <b>الجيجابايت (GB)</b>.`,
    facts:[
      {ico:'🎬', txt:'ساعة <b>Netflix HD</b> = <b>3 GB</b>. ساعة <b>4K</b> = <b>7 GB</b>.'},

      {ico:'📱', txt:'تحديث التطبيقات تلقائياً يستهلك <b>2-5 GB/شهر</b> — أوقفه على بيانات الجوال.'},
      {ico:'💡', txt:'<b>WiFi 5GHz</b> أسرع لكن مداه أقصر. <b>2.4GHz</b> أبطأ لكن يخترق الجدران.'}

let DB = {};
let generatedImage = null;
let currentEditYM = null;

/* =========================================================
   2) التخزين
========================================================= */
function loadDB(){
  try{ DB = JSON.parse(localStorage.getItem('utilities_db_v5')||'{}'); }catch(e){ DB = {}; }
}
function saveDB(){ localStorage.setItem('utilities_db_v5', JSON.stringify(DB)); }

/* =========================================================
   3) بناء واجهة الإدخال
========================================================= */
function buildEntryUI(){
  UTILITIES.forEach(u=>{
    const box=document.getElementById('fields-'+u.id);
    box.innerHTML='';
    FIELDS.forEach(f=>{
      const row=document.createElement('div');
      row.className='field-row';
      row.innerHTML=`<label>${f} (${u.unit})</label>
        <input type="number" id="inp-${u.id}-${f}" value="0" placeholder="0" inputmode="decimal">`;
      box.appendChild(row);
    });
  });
}
function ymNow(){
  const d=new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
}
function refreshEntryBadge(ym){
  const [y,m]=ym.split('-');
  document.getElementById('entry-badge').innerText=`${MONTHS_AR[+m-1]} ${y}`;
}

/* ====== قفز سريع في الإدخال ====== */
function buildEntrySelects(){
  const mSel=document.getElementById('entryMonth');
  const ySel=document.getElementById('entryYear');
  mSel.innerHTML=MONTHS_AR.map((m,i)=>`<option value="${i+1}">${m}</option>`).join('');
  const cur=new Date().getFullYear();
  let html='';
  for(let y=cur;y>=2000;y--) html+=`<option value="${y}">${y}</option>`;
  ySel.innerHTML=html;
  const now=new Date();
  mSel.value=now.getMonth()+1;
  ySel.value=now.getFullYear();
}

function loadMonthForEdit(){
  const m=document.getElementById('entryMonth').value;
  const y=document.getElementById('entryYear').value;
  const ym=`${y}-${String(m).padStart(2,'0')}`;
  currentEditYM=ym;
  const data=DB[ym]||{};
  UTILITIES.forEach(u=>FIELDS.forEach(f=>{
    const el=document.getElementById(`inp-${u.id}-${f}`);
    if(el) el.value=data[u.id]?.[f]??0;
  }));
  refreshEntryBadge(ym);
  const badge=document.getElementById('editingBadge');
  const isCurrent = ym===ymNow();
  if(isCurrent){
    badge.classList.remove('show');
  } else {
    badge.classList.add('show');
    badge.innerText=`✏️ تعديل: ${MONTHS_AR[+m-1]} ${y}`;
  }
  showToast(`✅ تم تحميل بيانات ${MONTHS_AR[+m-1]} ${y} للإدخال`);
}

function loadCurrentMonth(){
  const now=new Date();
  document.getElementById('entryMonth').value=now.getMonth()+1;
  document.getElementById('entryYear').value=now.getFullYear();
  loadMonthForEdit();
}

function saveSelectedMonth(){
  const ym = currentEditYM || ymNow();
  const entry={};
  UTILITIES.forEach(u=>{
    entry[u.id]={};
    FIELDS.forEach(f=>{
      const el=document.getElementById(`inp-${u.id}-${f}`);
      entry[u.id][f]=parseFloat(el.value)||0;
    });
  });
  DB[ym]=entry; saveDB();
  const [y,m]=ym.split('-');
  showToast(`✅ تم حفظ بيانات ${MONTHS_AR[+m-1]} ${y}`);
  renderAll();
}

/* =========================================================
   4) أدوات حساب
========================================================= */
function getBill(data,u){ return parseFloat(data?.[u.id]?.['الفاتورة'])||0; }
function getCons(data,u){ return parseFloat(data?.[u.id]?.['الاستهلاك'])||0; }
function monthTotal(data){ return UTILITIES.reduce((s,u)=>s+getBill(data,u),0); }

function sortedKeys(){ return Object.keys(DB).sort().reverse(); }
function keysAsc(){ return Object.keys(DB).sort(); }

/* =========================================================
   6) بطاقة شهر (نفس التصميم السابق)
========================================================= */
function buildMonthCard(ym, idx){
  const [y,m]=ym.split('-');
  const mName=MONTHS_AR[+m-1];
  const data=DB[ym];
  const total=monthTotal(data);
  const bills=UTILITIES.map(u=>getBill(data,u));
  const maxBill=Math.max(...bills,1);
  const H=180;

  const listHTML=UTILITIES.map(u=>{
    const cons=getCons(data,u);
    const bill=getBill(data,u);
    return `
      <div class="util-line ${u.cls}">
        <div class="util-icon">${u.emoji}</div>
        <div class="util-info">
          <div class="name">${u.name}</div>
          <div class="cons">الاستهلاك: <b>${cons.toLocaleString()} ${u.unit}</b></div>
        </div>
        <div class="util-price">${bill.toLocaleString()} <small>ج.م</small></div>
      </div>`;
  }).join('');

  const barsHTML=UTILITIES.map((u,i)=>{
    const bill=bills[i];
    const h=Math.max((bill/maxBill)*H,6);
    const col=COLORS[u.id];
    return `
      <div class="bar-col">
        <div class="bar-rect" style="height:${h}px;background:linear-gradient(180deg,${col} 0%,${col}bb 100%);">
          <div class="glow"></div>
          <div class="bar-val">${bill.toLocaleString()}</div>
        </div>
        <div class="bar-label">
          <span class="emoji">${u.emoji}</span>
          <span>${u.name}</span>
        </div>
      </div>`;
  }).join('');

  return `
    <div class="month-card" data-ym="${ym}" style="animation-delay:${Math.min(idx*0.06,0.4)}s">
      <div class="mc-head">
        <div class="mc-head-left">
          <div class="mc-month-circle">
            <span class="num">${+m}</span>
            <span class="yr">${y}</span>
          </div>
          <div class="mc-title-block">
            <h3>${mName} ${y}</h3>
            <p>🗓️ تقرير استهلاك وفواتير المرافق</p>
          </div>
        </div>
        <div class="mc-total-badge">
          <small>الإجمالي</small>
          <span>${total.toLocaleString()} ج.م</span>
        </div>
      </div>
      <div class="mc-body">
        <div class="mc-list">
          <div class="mc-list-title">📋 تفاصيل المرافق</div>
          ${listHTML}
          <div class="mc-total-line">
            <span class="lbl">💰 الإجمالي المدفوع</span>
            <span class="val">${total.toLocaleString()} ج.م</span>
          </div>
        </div>
        <div class="mc-chart">
          <div class="chart-title">📊 مقارنة بصرية</div>
          <div class="chart-bars">${barsHTML}</div>
        </div>
      </div>
      <div class="mc-actions">
        <button class="mini-btn" onclick="shareMonthText('${ym}')">📱 مشاركة</button>
        <button class="mini-btn" onclick="loadMonthFromCard('${ym}')">✏️ تعديل</button>
        <button class="mini-btn danger" onclick="deleteMonth('${ym}')">🗑️ حذف</button>
      </div>
    </div>`;
}
function loadMonthFromCard(ym){
  const [y,m]=ym.split('-');
  document.getElementById('entryMonth').value=+m;
  document.getElementById('entryYear').value=y;
  currentEditYM=ym;
  const data=DB[ym]||{};
  UTILITIES.forEach(u=>FIELDS.forEach(f=>{
    const el=document.getElementById(`inp-${u.id}-${f}`);
    if(el) el.value=data[u.id]?.[f]??0;
  }));
  refreshEntryBadge(ym);
  const badge=document.getElementById('editingBadge');
  badge.classList.add('show');
  badge.innerText=`✏️ تعديل: ${MONTHS_AR[+m-1]} ${y}`;
  switchTab('entry',document.querySelectorAll('.tab')[0]);
  showToast(`✏️ جاهز للتعديل على ${MONTHS_AR[+m-1]} ${y}`);
}

/* =========================================================

========================================================= */
function renderTimeline(){
  const feed=document.getElementById('monthsFeed');
  const keys=sortedKeys();
  if(keys.length===0){
    feed.innerHTML=`<div class="empty-state"><div class="icon">📭</div><h3>لا توجد بيانات بعد</h3><p>ابدأ بإدخال بيانات الشهر الحالي من تبويب الإدخال</p></div>`;
    return;
  }
  feed.innerHTML=keys.map((k,i)=>buildMonthCard(k,i)).join('');
}

/* =========================================================
   8) تبويب سنوي
========================================================= */
function buildYearCard(year, idx){
  const yearKeys = Object.keys(DB).filter(k=>k.startsWith(year+'-')).sort();
  const monthCount = yearKeys.length;
  let yearTotal = 0;
  const uTotals = {};
  const uCons = {};
  UTILITIES.forEach(u=>{uTotals[u.id]=0; uCons[u.id]=0;});

  const monthsData = {};
  for(let mi=1; mi<=12; mi++){
    const ym=`${year}-${String(mi).padStart(2,'0')}`;
    if(DB[ym]){
      const d=DB[ym];
      monthsData[mi]={ym, total:monthTotal(d), bills:UTILITIES.map(u=>getBill(d,u))};
      yearTotal += monthTotal(d);
      UTILITIES.forEach(u=>{
        uTotals[u.id]+=getBill(d,u);
        uCons[u.id]+=getCons(d,u);
      });
    } else {
      monthsData[mi]=null;
    }
  }

  // ملخص المرافق
  const summaryHTML = UTILITIES.map(u=>`
    <div class="year-mini ${u.cls}">
      <div class="lbl">${u.emoji} ${u.name}</div>
      <div class="big">${uTotals[u.id].toLocaleString()} <small>ج.م</small></div>
      <div class="sub">📈 استهلاك: ${uCons[u.id].toLocaleString()} ${u.unit}</div>
      <div class="sub">⚖️ متوسط شهري: ${monthCount?Math.round(uTotals[u.id]/monthCount).toLocaleString():0} ج.م</div>
    </div>
  `).join('');

  // مخطط 12 شهر
  const maxVal = Math.max(
    ...Object.values(monthsData).filter(Boolean).flatMap(m=>m.bills),
    1
  );
  const chartBars = Array.from({length:12},(_,i)=>{
    const mi=i+1;
    const md=monthsData[mi];
    const isMissing = !md;
    const bars = md ? md.bills.map((v,j)=>{
      const u=UTILITIES[j];
      const h=(v/maxVal)*140;
      return `<div class="year-bar" style="height:${Math.max(h,1)}px;background:${COLORS[u.id]};width:6px" title="${u.name}: ${v.toLocaleString()}"></div>`;
    }).join('') : UTILITIES.map(()=>`<div class="year-bar" style="height:2px;background:var(--border);width:6px"></div>`).join('');
    return `
      <div class="year-bar-col">
        <div class="year-bar-group">${bars}</div>
        <div class="year-bar-label">${MONTHS_AR[i].slice(0,3)}</div>
      </div>`;
  }).join('');

  // قائمة الشهور
  const monthsListHTML = yearKeys.map(ym=>{
    const [y,m]=ym.split('-');
    const d=DB[ym];
    const tot=monthTotal(d);
    const uTxt = UTILITIES.map(u=>`${u.emoji} ${getBill(d,u).toLocaleString()}`).join(' • ');
    return `
      <div class="year-month-row" onclick="jumpToMonthFromCard('${ym}')">
        <div class="year-month-tag">
          <span class="mn">${+m}</span>
          <span class="my">${y}</span>
        </div>
        <div class="year-month-info">
          <div class="name">${MONTHS_AR[+m-1]} ${y}</div>
          <div class="detail">${uTxt}</div>
        </div>
        <div class="year-month-total">${tot.toLocaleString()} <small style="font-size:10px;color:var(--muted)">ج.م</small></div>
      </div>`;
  }).join('');

  return `
    <div class="year-card" data-year="${year}" style="animation-delay:${Math.min(idx*0.1,0.5)}s">
      <div class="year-head">
        <div class="year-title">
          <div class="year-circle">
            <span class="num">${year}</span>
            <span class="lbl">سنة</span>
          </div>
          <div>
            <h3>تقرير سنة ${year}</h3>
            <p>📅 ${monthCount} شهر مسجل • ${monthCount===12?'سنة كاملة ✨':'سنة جزئية'}</p>
          </div>
        </div>
        <div class="year-total-badge">
          <small>الإجمالي السنوي</small>
          <span>${yearTotal.toLocaleString()} ج.م</span>
        </div>
      </div>

      <div class="year-summary">${summaryHTML}</div>

      <div class="year-chart-section">
        <div class="year-chart-title">
          <span>📊 مقارنة شهرية — ${year}</span>
          <div class="legend">
            ${UTILITIES.map(u=>`<span><span class="dot ${u.cls}"></span>${u.name}</span>`).join('')}
          </div>
        </div>
        <div class="year-chart">${chartBars}</div>
      </div>

      <div class="year-months-list">
        <div class="mc-list-title" style="padding:0 4px 4px">📋 كل الشهور المسجلة</div>
        ${monthsListHTML}
      </div>
    </div>`;
}

/* =========================================================
   9) البحث السريع (شهري)
========================================================= */
function buildSearchSelects(){
  const mSel=document.getElementById('searchMonth');
  const ySel=document.getElementById('searchYear');
  mSel.innerHTML=MONTHS_AR.map((m,i)=>`<option value="${i+1}">${m}</option>`).join('');
  const cur=new Date().getFullYear();
  let html='';
  for(let y=cur;y>=2000;y--) html+=`<option value="${y}">${y}</option>`;
  ySel.innerHTML=html;
  mSel.value=new Date().getMonth()+1;
  ySel.value=cur;
}
function jumpToMonth(){
  const m=document.getElementById('searchMonth').value;
  const y=document.getElementById('searchYear').value;
  const ym=`${y}-${String(m).padStart(2,'0')}`;
  const card=document.querySelector(`.month-card[data-ym="${ym}"]`);
  if(card){
    card.scrollIntoView({behavior:'smooth',block:'center'});
    card.style.transition='.5s';
    card.style.boxShadow='0 0 0 3px var(--accent), 0 12px 35px rgba(74,108,247,.4)';
    setTimeout(()=>card.style.boxShadow='',1800);
  } else showToast(`⚠️ لا توجد بيانات لـ ${MONTHS_AR[+m-1]} ${y}`,'error');
}
function scrollToTopTimeline(){
  document.getElementById('monthsFeed').scrollIntoView({behavior:'smooth'});
}

function deleteMonth(ym){
  const [y,m]=ym.split('-');
  if(!confirm(`🗑️ حذف بيانات ${MONTHS_AR[+m-1]} ${y}؟`)) return;
  delete DB[ym]; saveDB(); renderAll();
  showToast('🗑️ تم الحذف');
}
function shareMonthText(ym){
  window.open(`https://wa.me/?text=${encodeURIComponent(genMonthText(ym))}`,'_blank');
}
function genMonthText(ym){
  const [y,m]=ym.split('-');
  const d=DB[ym];
  let t=`*تقرير المرافق - ${MONTHS_AR[+m-1]} ${y}*\n━━━━━━━━━━━━━━\n`;
  let total=0;
  UTILITIES.forEach(u=>{
    const c=getCons(d,u), b=getBill(d,u);
    t+=`${u.emoji} *${u.name}*\n   • الاستهلاك: ${c} ${u.unit}\n   • الفاتورة: ${b} ج.م\n`;
    total+=b;
  });
  t+=`━━━━━━━━━━━━━━\n💰 *الإجمالي: ${total.toLocaleString()} ج.م*\n✍️ أحمد عماره`;
  return t;
}
function shareAllText(){
  const keys=sortedKeys();
  if(!keys.length){showToast('⚠️ لا توجد بيانات','error');return}
  let t=`*📊 تقرير شامل للمرافق*\n🗓️ ${keys.length} شهر\n━━━━━━━━━━━━━━\n\n`;
  keys.forEach(ym=>{
    const [y,m]=ym.split('-');
    const d=DB[ym];
    t+=`*📅 ${MONTHS_AR[+m-1]} ${y}* — ${monthTotal(d).toLocaleString()} ج.م\n`;
    UTILITIES.forEach(u=>t+=`  ${u.emoji} ${u.name}: ${getBill(d,u).toLocaleString()} ج.م\n`);
    t+=`\n`;
  });
  t+=`━━━━━━━━━━━━━━\n✍️ أحمد عماره`;
  window.open(`https://wa.me/?text=${encodeURIComponent(t)}`,'_blank');
}
function shareCurrentText(){

  let total=0;

  t+=`━━━━━━━━━━━━━━\n💰 *الإجمالي: ${total.toLocaleString()} ج.م*\n✍️ أحمد عماره`;

/* =========================================================
   12) JSON
========================================================= */
function exportJSON(){
  if(!Object.keys(DB).length){showToast('⚠️ لا توجد بيانات','error');return}
  const blob=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download=`utilities_backup_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('📤 تم التصدير');
}
function importJSON(e){
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=ev=>{
    try{
      const data=JSON.parse(ev.target.result);
      if(typeof data!=='object'||Array.isArray(data)) throw new Error('bad');
      const merge=confirm(`📥 دمج ${Object.keys(data).length} شهر؟\n\n"موافق" = دمج\n"إلغاء" = استبدال كامل`);
      if(merge){ DB={...DB,...data}; }
      else{
        if(!confirm('⚠️ تأكيد: سيتم استبدال كل البيانات؟')){e.target.value='';return}
        DB=data;
      }
      saveDB(); renderAll();
      showToast(`✅ تم استيراد ${Object.keys(data).length} شهر`);
    }catch(err){ showToast('❌ ملف غير صالح','error'); }
    e.target.value='';
  };
  r.readAsText(f);
}

/* =========================================================
   13) أدوات عامة
========================================================= */
function switchTab(id,btn){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('section-'+id).classList.add('active');
  if(id==='timeline') renderTimeline();
  if(id==='yearly') { renderYearly(); buildYearSelect(); }
}
function toggleTheme(){
  document.body.classList.toggle('light');
  const isLight=document.body.classList.contains('light');
  document.getElementById('themeBtn').innerText=isLight?'🌙':'☀️';
  localStorage.setItem('utilities_theme_v5',isLight?'light':'dark');
}
function showToast(msg,type=''){
  const t=document.getElementById('toast');
  t.innerText=msg; t.className='toast show'+(type?' '+type:'');
  clearTimeout(t._t); t._t=setTimeout(()=>t.className='toast',2600);
}
function clearAll(){
  if(!confirm('⚠️ مسح كل البيانات؟'))return;
  if(!confirm('🚨 تأكيد نهائي؟'))return;
  DB={}; saveDB(); renderAll();
  showToast('🗑️ تم المسح');
}
function renderAll(){
  renderTimeline(); renderYearly(); buildSearchSelects(); buildYearSelect();
}

/* =========================================================
   14) التهيئة
========================================================= */
window.onload=function(){
  if(localStorage.getItem('utilities_theme_v5')==='light'){
    document.body.classList.add('light');

  }
  buildEntryUI();
  buildEntrySelects();

  loadDB();
  currentEditYM=ymNow();
  loadCurrentMonth();
  renderAll();
  document.getElementById('imageModal').addEventListener('click',function(e){
    if(e.target===this) closeModal();
  });
};
